{% extends "base.html" %}

{% block title %}Find Jobs | JobPortal{% endblock %}

{% block content %}

<section class="jobs-page">

    <div class="jobs-header">

        <div>
            <span class="jobs-badge">💼 JOBPORTAL JOBS</span>

            <h1>Find your next opportunity.</h1>

            <p>
                Discover jobs that match your skills, experience and career goals.
            </p>
        </div>

        <div class="jobs-count">
            <strong id="jobsCount">0</strong>
            <span>Jobs Available</span>
        </div>

    </div>


    <!-- Search -->

    <div class="jobs-search">

        <div class="search-box">
            🔍
            <input
                type="text"
                id="jobSearch"
                placeholder="Search job title, company or skills..."
            >
        </div>

        <div class="search-box location-search">
            📍
            <input
                type="text"
                id="locationSearch"
                placeholder="Location..."
            >
        </div>

    </div>


    <!-- Jobs -->

    <div id="jobs-container" class="jobs-grid">

        <div class="jobs-loading">
            <div class="loading-spinner"></div>
            <p>Finding opportunities...</p>
        </div>

    </div>

</section>



{% endblock %}
