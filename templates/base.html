{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}JobPortal{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">

            <a href="/" class="logo">
                Job<span>Portal</span>
            </a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/jobs/">Find Jobs</a>
                <a href="/my-applications/">My Applications</a>
                <a href="/candidate-profile-view/" class="nav-link">👤 My Profile</a>
                <span id="guestLinks">
                    <a href="/login/">Login</a>
                    <a href="/signup/" class="nav-btn">Get Started</a>
                </span>

                <button id="baseLogout" class="nav-btn" type="button" style="display: none;">
                    Logout
                </button>

                <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                    🌙
                </button>
            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">

            <div>
                <h3>JobPortal</h3>
                <p>
                    Find your dream job and connect with the right opportunities.
                </p>
            </div>

            <div>
                <p>© 2026 JobPortal. All rights reserved.</p>
            </div>

        </div>
    </footer>

    <script src="{% static 'js/app.js' %}"></script>

</body>

</html>

<script>

    const accessToken = localStorage.getItem("access_token");

    const guestLinks = document.getElementById("guestLinks");
    const baseLogout = document.getElementById("baseLogout");

    if (accessToken) {

        if (guestLinks) {
            guestLinks.style.display = "none";
        }

        if (baseLogout) {
            baseLogout.style.display = "inline-flex";
        }

    } else {

        if (guestLinks) {
            guestLinks.style.display = "inline-flex";
        }

        if (baseLogout) {
            baseLogout.style.display = "none";
        }

    }


    if (baseLogout) {

        baseLogout.addEventListener("click", function () {

            localStorage.removeItem("access_token");
            localStorage.removeItem("refresh_token");

            window.location.href = "/login/";

        });

    }

</script>
