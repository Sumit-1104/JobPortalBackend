{% extends "employer_base.html" %}

{% block title %}My Jobs | JobPortal{% endblock %}

{% block content %}

<section class="applications-page">

    <!-- Page Header -->
    <div class="applications-header">

        <div>
            <span class="applications-badge">
                💼 MY JOBS
            </span>

            <h1>My Jobs</h1>

            <p>
                Manage the jobs you have posted.
            </p>
        </div>

    </div>


    <!-- Jobs Container -->
    <div id="myJobsContainer" class="applications-grid">

        <div class="application-message">

            <div class="empty-icon">
                ⏳
            </div>

            <h2>Loading jobs...</h2>

            <p>
                Please wait while we load your jobs.
            </p>

        </div>

    </div>

</section>


<script>

    document.addEventListener("DOMContentLoaded", function () {

        const container = document.getElementById("myJobsContainer");

        const token = localStorage.getItem("access_token");

        if (!token) {

            container.innerHTML = `
            <div class="application-message">

                <div class="empty-icon">
                    🔒
                </div>

                <h2>Login Required</h2>

                <p>
                    Please login as an employer to view your jobs.
                </p>

            </div>
        `;

            return;
        }


        fetch("/api/jobs/my-jobs/", {

            method: "GET",

            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }

        })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Failed to load jobs.");
                }

                return response.json();

            })

            .then(jobs => {

                container.innerHTML = "";

                if (jobs.length === 0) {

                    container.innerHTML = `
                <div class="application-message">

                    <div class="empty-icon">
                        💼
                    </div>

                    <h2>No Jobs Posted</h2>

                    <p>
                        You have not posted any jobs yet.
                    </p>

                    <a
                        href="/employer-post-job/"
                        class="publish-btn"
                        style="display:inline-block; text-decoration:none; margin-top:20px;"
                    >
                        + Post a Job
                    </a>

                </div>
            `;

                    return;
                }


                jobs.forEach(job => {

                    const jobCard = document.createElement("div");

                    jobCard.className = "application-card";

                    jobCard.innerHTML = `

                <div class="application-card-header">

                    <div class="application-icon">
                        💼
                    </div>

                    <div>

                        <h2>
                            ${job.title}
                        </h2>

                        <p>
                            ${job.company}
                        </p>

                    </div>

                </div>


                <div class="application-info">

                    <div>
                        <span>Location</span>
                        <strong>
                            ${job.location}
                        </strong>
                    </div>

                    <div>
                        <span>Job Type</span>
                        <strong>
                            ${job.job_type}
                        </strong>
                    </div>

                    <div>
                        <span>Salary</span>
                        <strong>
                            ${job.salary ? "₹ " + job.salary : "Not specified"}
                        </strong>
                    </div>

                </div>


                <div style="
                    margin-top:20px;
                    display:flex;
                    gap:12px;
                    flex-wrap:wrap;
                ">

                    <a
    href="/employer-view-job/${job.id}/"
    class="publish-btn"
    style="text-decoration:none;"
>
    👁 View
</a>

<a
    href="/employer-edit-job/${job.id}/"
    class="publish-btn"
    style="text-decoration:none;"
>
    ✏️ Edit
</a>

<button
    type="button"
    class="cancel-btn"
    onclick="deleteJob(${job.id})"
>
    🗑 Delete
</button>

                </div>

            `;

                    container.appendChild(jobCard);

                });

            })

            .catch(error => {

                console.error(error);

                container.innerHTML = `
            <div class="application-message">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h2>Unable to Load Jobs</h2>

                <p>
                    Something went wrong while loading your jobs.
                </p>

            </div>
        `;

            });

    });


    function deleteJob(jobId) {

        const token = localStorage.getItem("access_token");

        if (!token) {
            alert("Please login again.");
            return;
        }


        const confirmDelete = confirm(
            "Are you sure you want to delete this job?"
        );

        if (!confirmDelete) {
            return;
        }


        fetch(`/api/jobs/${jobId}/`, {

            method: "DELETE",

            headers: {
                "Authorization": "Bearer " + token
            }

        })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Failed to delete job.");
                }

                alert("Job deleted successfully.");

                window.location.reload();

            })

            .catch(error => {

                console.error(error);

                alert("Unable to delete the job.");

            });

    }

</script>

{% endblock %}
